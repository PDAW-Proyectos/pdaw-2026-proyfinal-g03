<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo: planes con Gemini</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    form { display: grid; gap: .75rem; grid-template-columns: 1fr 1fr; }
    label { display: grid; gap: .25rem; font-size: .9rem; }
    input, select { padding: .5rem; font-size: 1rem; }
    .botones { grid-column: 1 / -1; display: flex; gap: .75rem; flex-wrap: wrap; }
    button { padding: .6rem 1rem; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    #estado { min-height: 1.5rem; margin-top: 1rem; }
    #estado.error { color: #b00020; }
    #resultado section { margin: 1rem 0; padding: .5rem 1rem; border: 1px solid #8884; border-radius: 8px; }
    .aviso { font-size: .85rem; opacity: .75; margin-top: 2rem; }
  </style>
</head>
<body>
  <h1>Planes de Entrenamiento</h1>

  <form id="formulario">
    <label>Edad (años)
      <input type="number" name="edad" min="14" max="90" required>
    </label>
    <label>Peso (kg)
      <input type="number" name="peso" min="30" max="250" step="0.1" required>
    </label>
    <label>Altura (cm)
      <input type="number" name="altura" min="120" max="230" required>
    </label>
    <label>Días por semana
      <input type="number" name="dias" min="1" max="7" value="3" required>
    </label>
    <label>Objetivo
      <select name="objetivo">
        <option value="perder_peso">Perder peso</option>
        <option value="ganar_musculo">Ganar masa muscular</option>
        <option value="mantener">Mantenerme</option>
        <option value="resistencia">Mejorar resistencia</option>
      </select>
    </label>
    <label>Nivel
      <select name="nivel">
        <option value="principiante">Principiante</option>
        <option value="intermedio">Intermedio</option>
        <option value="avanzado">Avanzado</option>
      </select>
    </label>
    <div class="botones">
      <button type="button" data-tipo="entrenamiento">Generar plan de ejercicios</button>
      <button type="button" data-tipo="nutricion">Generar plan de nutrición</button>
    </div>
  </form>

  <p id="estado" role="status"></p>
  <div id="resultado"></div>

  <p class="aviso">Los planes son orientativos. No reemplazan la indicación de un profesional.</p>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
