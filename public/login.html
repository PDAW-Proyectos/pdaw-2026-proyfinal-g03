<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Iron Temple</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="img/pesa.png">
    <link rel="stylesheet" href="./css/styles.css">
    
    <style>
        /* Estilos específicos solo para el login */
        .login-body {
            height: 100vh;
            overflow: hidden;
        }
        .login-img-side {
            background-image: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .login-img-side::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(10,10,10,0.6) 0%, rgba(10,10,10,0.9) 100%);
        }
        .login-form-side {
            background-color: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative; /* Para posicionar el botón de volver */
        }
        .login-form-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .login-input {
            background-color: #161616 !important;
            border: 1px solid #333 !important;
            color: white !important;
            border-radius: 0 !important;
            padding: 12px 15px !important;
        }
        .login-input:focus {
            border-color: var(--pulso-green) !important;
            box-shadow: none !important;
        }
        .login-input::placeholder {
            color: #666 !important;
        }
        /* Botón de volver al inicio */
        .btn-back-home {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #a0a0a0;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
            z-index: 10;
        }
        .btn-back-home:hover {
            color: var(--pulso-green);
        }
    </style>
</head>
<body class="login-body">

    <div class="container-fluid h-100">
        <div class="row h-100">
            
            <!-- Lado Izquierdo: Imagen (Oculto en celulares) -->
            <div class="col-lg-6 d-none d-lg-block login-img-side">
                <!-- Opcional: Podés poner un texto flotante acá si querés -->
            </div>

            <!-- Lado Derecho: Formulario -->
            <div class="col-12 col-lg-6 login-form-side">
                
                <!-- NUEVO BOTÓN PARA VOLVER AL INICIO -->
                <a href="index.html" class="btn-back-home">
                    <i class="bi bi-arrow-left"></i> Volver al inicio
                </a>

                <div class="login-form-wrapper">
                    
                    <!-- Logo -->
                    <div class="text-center mb-5">
                        <a class="navbar-brand fs-2" href="index.html">
                            <span class="text-green"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-dumbbell preview-icon"><path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"/><path d="m2.5 21.5 1.4-1.4"/><path d="m20.1 3.9 1.4-1.4"/><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"/><path d="m9.6 14.4 4.8-4.8"/></svg></span> IRON TEMPLE<span class="text-green">.</span>
                        </a>
                    </div>

                    <!-- Título -->
                    <div class="text-center mb-4">
                        <h2 class="display-5 fw-bold mb-2">BIENVENIDO.</h2>
                        <p class="text-gray">Ingresá a tu cuenta para continuar.</p>
                    </div>

                    <!-- Formulario -->
                    <form action="usuario.html">
                        <div class="mb-3">
                            <label for="email" class="text-white mb-2" style="font-size: 14px;">Correo Electrónico</label>
                            <input type="email" class="form-control login-input" id="email" placeholder="tucorreo@email.com" required>
                        </div>
                        
                        <div class="mb-4">
                            <div class="d-flex justify-content-between">
                                <label for="password" class="text-white mb-2" style="font-size: 14px;">Contraseña</label>
                                <a href="#" class="text-green" style="font-size: 13px; text-decoration: none;">¿Olvidaste tu contraseña?</a>
                            </div>
                            <input type="password" class="form-control login-input" id="password" placeholder="••••••••" required>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe" style="background-color: #161616; border-color: #333; border-radius: 0;">
                            <label class="form-check-label text-gray" for="rememberMe" style="font-size: 14px;">Recordarme</label>
                        </div>

                        <button type="submit" class="btn btn-green w-100 py-3 mb-4" style="font-size: 16px;">INGRESAR AL TEMPLO ↗</button>
                    </form>

                    <!-- Separador -->
                    <div class="d-flex align-items-center mb-4">
                        <hr class="flex-grow-1 border-secondary">
                        <span class="px-3 text-gray" style="font-size: 13px;">O</span>
                        <hr class="flex-grow-1 border-secondary">
                    </div>

                    <!-- Botones de Google / Registro -->
                    <div class="d-grid gap-3">                      
                        <div class="text-center mt-3">
                            <span class="text-gray" style="font-size: 14px;">¿No tenés cuenta? </span>
                            <a href="registro.html" class="text-green text-decoration-none fw-bold" style="font-size: 14px;">Registrate acá</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
